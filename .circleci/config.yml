version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0
  node: circleci/node@6.3.0

executors:
  docker-python:
    docker:
      - image: circleci/python:3.7
  docker-terraform:
    docker:
      - image: hashicorp/terraform:latest
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root
  long_no_output: &long_no_output
    no_output_timeout: 60m

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  preview-terraform:
    description: "Previews terraform state changes"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          <<: *long_no_output
          name: get, init, and plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
            terraform plan
  terraform-init-then-destroy:
    description: "Initializes and destroys terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          <<: *long_no_output
          name: get and init
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
      - run:
          <<: *long_no_output
          name: destroy
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform destroy -auto-approve
  remove-lambda:
    description: "Removes API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - node/install
      - run:
          <<: *long_no_output
          name: Install packages and remove lambda
          command: |
            cd ./SingleViewApi/
            npm ci
            npx --yes serverless@4 remove --stage <<parameters.stage>>
  snapshot-postgres:
    description: "Creates an RDS snapshot and waits until it is available"
    parameters:
      db-instance-identifier:
        type: string
    steps:
      - *attach_workspace
      - run:
          <<: *long_no_output
          name: Install Unzip
          command: apt-get update && apt-get install -y unzip
      - run:
          <<: *long_no_output
          name: Install AWS CLI
          command: |
            curl -L -o awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            unzip awscliv2.zip
            ./aws/install
      - run:
          <<: *long_no_output
          name: Create RDS snapshot and wait until available
          environment:
            # The CLI image has no pager, and a pager would block the job anyway
            AWS_PAGER: ""
          command: |
            SNAPSHOT_ID="<<parameters.db-instance-identifier>>-final-$(date +%Y%m%d%H%M%S)"
            echo "Creating snapshot ${SNAPSHOT_ID} of <<parameters.db-instance-identifier>>"
            aws rds create-db-snapshot \
              --region eu-west-2 \
              --db-instance-identifier "<<parameters.db-instance-identifier>>" \
              --db-snapshot-identifier "${SNAPSHOT_ID}"
            aws rds wait db-snapshot-available \
              --region eu-west-2 \
              --db-snapshot-identifier "${SNAPSHOT_ID}"
            aws rds describe-db-snapshots \
              --region eu-west-2 \
              --db-snapshot-identifier "${SNAPSHOT_ID}" \
              --query "DBSnapshots[0].{Id:DBSnapshotIdentifier,Status:Status,Created:SnapshotCreateTime}" \
              --output table
            echo "Snapshot available: ${SNAPSHOT_ID}"

jobs:
  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION
  preview-terraform-production:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "production"
  snapshot-production-database:
    executor: docker-dotnet
    steps:
      - snapshot-postgres:
          db-instance-identifier: "singleview-db-production"
  remove-from-production:
    executor: docker-dotnet
    steps:
      - remove-lambda:
          stage: "production"
  terraform-destroy-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-destroy:
          environment: "production"

workflows:
  # Development and staging teardown (SSI-1305) are complete. Do not plan, apply,
  # or destroy those stacks (that would recreate RDS/Redis).
  #
  # Production teardown in one master pipeline: plan → snapshot RDS → remove
  # Serverless → terraform destroy. Each destructive step is gated by approval.
  tear-down-production:
    jobs:
      - assume-role-production:
          context: api-assume-role-corporate-production-context
          filters:
            branches:
              only: master
      - preview-terraform-production:
          requires:
            - assume-role-production
          filters:
            branches:
              only: master
      - permit-production-db-snapshot:
          type: approval
          requires:
            - preview-terraform-production
          filters:
            branches:
              only: master
      - snapshot-production-database:
          requires:
            - permit-production-db-snapshot
          filters:
            branches:
              only: master
      - permit-production-api-teardown:
          type: approval
          requires:
            - snapshot-production-database
          filters:
            branches:
              only: master
      - remove-from-production:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - permit-production-api-teardown
          filters:
            branches:
              only: master
      - permit-production-terraform-destroy:
          type: approval
          requires:
            - remove-from-production
          filters:
            branches:
              only: master
      - terraform-destroy-production:
          requires:
            - permit-production-terraform-destroy
          filters:
            branches:
              only: master
